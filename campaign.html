<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Kochvei Toras Zev</title>
  <meta name="description" content="Join our constellation of supporters at Cheder Toras Zev" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />

  <!-- PWA -->
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Toras Zev" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=close,error,info,restart_alt,skip_next,star" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0f;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    #cesiumContainer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    #app {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
    }

    #app > * {
      pointer-events: auto;
    }

    /* Loading screen */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      z-index: 1000;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .loader-title {
      font-size: 32px;
      font-weight: 300;
      color: #d4af37;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .loader-title-hebrew {
      font-size: 24px;
      color: rgba(255, 255, 255, 0.8);
      font-family: 'Noto Sans Hebrew', sans-serif;
      margin-bottom: 24px;
    }

    .loader-spinner {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(212, 175, 55, 0.2);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    .loader-status {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Cesium overrides */
    .cesium-viewer-bottom {
      display: none !important;
    }

    .cesium-credit-logoContainer,
    .cesium-credit-textContainer {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Cesium container -->
  <div id="cesiumContainer"></div>

  <!-- Vue app container -->
  <div id="app"></div>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="loader-content">
      <h1 class="loader-title">KOCHVEI TORAS ZEV</h1>
      <p class="loader-title-hebrew" dir="rtl">כוכבי תורת זאב</p>
      <div class="loader-spinner"></div>
      <p class="loader-status">Loading your journey...</p>
    </div>
  </div>

  <script type="module" src="/src/campaign/app/main.js"></script>
</body>
</html>
